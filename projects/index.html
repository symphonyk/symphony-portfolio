<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Projects · Symphony Koss</title>
  <meta name="description" content="Every project by Symphony Koss, in one manila folder.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Permanent+Marker&family=Reenie+Beanie&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/sheet.css">
  <link rel="stylesheet" href="../css/folder.css">
</head>
<body class="cork sheet-page folder-page">
  <a class="back-tab" href="../"><span class="pin pin--blue"></span>← back to the board</a>

  <!-- an open manila folder: the inside of the back (left) and front (right) covers -->
  <main class="folder">
    <h1 class="folder__tab">All Projects</h1>
    <section class="folder__side folder__side--l" aria-label="Projects">
      <div class="folder__grid">
        <div class="folder__cell"><a class="folder__item folder__item--film" href="headset-habitat/" style="--r: -2.5deg;">
          <img src="../assets/img/frame-headset-habitat.webp" width="506" height="736" alt="">
          <span class="folder__name">Headset Habitat</span>
        </a></div>
        <div class="folder__cell"><a class="folder__item folder__item--star" href="espressivo/" style="--r: 1.5deg;">
          <img src="../assets/img/frame-espressivo.webp" width="627" height="758" alt="">
          <span class="folder__name">Espressivo</span>
        </a></div>
        <div class="folder__cell"><a class="folder__item folder__item--plaid" href="candy-dispenser/" style="--r: 2deg;">
          <span class="tape tape--top tape--yellow"></span><img src="../assets/img/frame-candy-dispenser.webp" width="590" height="810" alt="">
          <span class="folder__name">Candy Dispenser</span>
        </a></div>
      </div>
    </section>
    <section class="folder__side folder__side--r" aria-label="More projects">
      <div class="folder__grid">
        <div class="folder__cell"><a class="folder__item folder__item--clip" href="cupboss/" style="--r: -1.5deg;">
          <img src="../assets/img/frame-cupboss.webp" width="524" height="784" alt="">
          <span class="folder__name">CupBoss</span>
        </a></div>
        <div class="folder__cell"><a class="folder__item folder__item--polaroid" href="spatulove/" style="--r: -2deg;">
          <span class="tape tape--top tape--mint"></span><span class="folder__photo"><img src="../assets/img/thumb-spatulove.jpg" width="946" height="946" alt=""></span>
          <span class="folder__name">Spatulove</span>
        </a></div>
        <div class="folder__cell"><a class="folder__item folder__item--polaroid folder__item--pink" href="cherry/" style="--r: 2.5deg;">
          <span class="tape tape--top"></span><span class="folder__photo"><img src="../assets/img/thumb-cherry.jpg" width="800" height="800" alt=""></span>
          <span class="folder__name">Cherry</span>
        </a></div>
      </div>
    </section>
  </main>

  <script src="../js/sheet.js" defer></script>
</body>
</html>
